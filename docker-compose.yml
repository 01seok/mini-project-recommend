version: '3.8'

services:
  recommend-api:
    build: .
    container_name: musinsa-recommend-service
    ports:
      - "8080:8080"
    environment:
      - ENV=production
    volumes:
      - ./app/data/musinsa_products.json:/app/app/data/musinsa_products.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: recommend-network
